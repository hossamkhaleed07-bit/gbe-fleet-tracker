<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل دوام — GBE Fleet Tracker</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --plane:     #f9f9f7;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --ink-muted: #898781;
    --grid:      #e1e0d9;
    --border:    rgba(11,11,11,0.12);
    --blue:      #2a78d6;
    --good:      #0ca30c;
    --critical:  #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19; --plane: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7;
      --ink-muted: #898781; --grid: #2c2c2a; --border: rgba(255,255,255,0.14); --blue: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --plane: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7;
    --ink-muted: #898781; --grid: #2c2c2a; --border: rgba(255,255,255,0.14); --blue: #3987e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--plane); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; line-height: 1.6;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 1.75rem 1.1rem 4rem; }
  .brand-logo { display: block; width: 84px; height: auto; margin: 0 0 1rem; border-radius: 10px; }
  h1 { font-size: 1.25rem; margin: 0 0 0.3rem; }
  .sub { color: var(--ink-muted); font-size: 0.85rem; margin: 0 0 1.5rem; }

  .lang-switch { display: flex; gap: 0.4rem; justify-content: flex-end; margin-bottom: 1rem; }
  .lang-switch button {
    padding: 0.35rem 0.75rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-1);
    color: var(--ink-muted); font-size: 0.78rem; font-weight: 600; cursor: pointer;
  }
  .lang-switch button.active { border-color: var(--blue); color: var(--blue); background: color-mix(in srgb, var(--blue) 10%, var(--surface-1)); }

  .choose-hint { font-size: 0.85rem; color: var(--ink-2); margin: 0 0 0.75rem; font-weight: 600; }
  .toggle { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 1.5rem; }
  .toggle button {
    padding: 1rem 0.4rem; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-1);
    color: var(--ink-2); font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center;
  }
  .toggle button .icon { display: block; font-size: 1.5rem; margin-bottom: 0.35rem; line-height: 1; }
  .toggle button.active { border-color: var(--blue); color: var(--blue); background: color-mix(in srgb, var(--blue) 10%, var(--surface-1)); }

  fieldset { border: none; padding: 0; margin: 0 0 1.5rem; }
  label { display: block; font-size: 0.85rem; color: var(--ink-2); margin-bottom: 0.35rem; }
  label .req { color: var(--critical); }
  .field { margin-bottom: 1.1rem; }
  input, select {
    width: 100%; padding: 0.7rem 0.8rem; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--ink); font-size: 0.95rem;
  }
  input:focus, select:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
  input[type="file"] { padding: 0.5rem; font-size: 0.85rem; }
  input[readonly] { cursor: not-allowed; }
  .hint { font-size: 0.76rem; color: var(--ink-muted); margin-top: 0.3rem; }
  .section-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); margin: 1.6rem 0 0.8rem; }

  button.submit {
    width: 100%; padding: 0.95rem; border-radius: 10px; border: none; background: var(--blue);
    color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button.submit:disabled { opacity: 0.55; cursor: default; }

  #status {
    margin-top: 1.1rem; padding: 0.85rem 1rem; border-radius: 10px; font-size: 0.9rem; display: none;
  }
  #status.ok { display: block; background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  #status.err { display: block; background: color-mix(in srgb, var(--critical) 15%, transparent); color: var(--critical); }
  #status.busy { display: block; background: var(--surface-1); color: var(--ink-2); border: 1px solid var(--border); }

  #config-note {
    display: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 1rem 1.1rem; margin-bottom: 1.5rem; font-size: 0.85rem; color: var(--ink-2);
  }
  #config-note code { background: var(--grid); padding: 0.1rem 0.35rem; border-radius: 4px; }

  #screen-success { text-align: center; padding-top: 1.5rem; }
  .success-icon {
    width: 64px; height: 64px; border-radius: 50%; background: var(--good); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.25rem;
  }
  #screen-success h2 { font-size: 1.15rem; margin: 0 0 0.75rem; }
  .success-message { color: var(--ink-2); font-size: 0.92rem; margin: 0 0 1.75rem; }
  #screen-success .submit { width: auto; padding: 0.85rem 2rem; }
</style>

<body>
<div class="wrap">
  <div class="lang-switch" id="lang-switch">
    <button type="button" data-lang="ar">عربي</button>
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="ur">اردو</button>

  <h1 data-i18n="heading"></h1>
  <p class="sub" data-i18n="subtitle"></p>

  <div id="config-note" data-i18n="configNote"></div>

  <div id="screen-form">
    <p class="choose-hint" data-i18n="chooseTypeTitle"></p>
    <div class="toggle" id="type-toggle">
      <button type="button" data-type="start"><span class="icon">▶️</span><span data-i18n="typeStart"></span></button>
      <button type="button" data-type="end"><span class="icon">⏹️</span><span data-i18n="typeEnd"></span></button>
      <button type="button" data-type="reinforcement"><span class="icon">💵</span><span data-i18n="typeReinforcement"></span></button>
    </div>

    <form id="shift-form" style="display:none">
      <div class="field">
        <label><span data-i18n="labelShiftDate"></span> <span class="req">*</span></label>
        <input type="date" id="shift_date" required>
        <p class="hint" data-i18n="hintShiftDate"></p>
      </div>
      <div class="field">
        <label><span data-i18n="labelIdentity"></span> <span class="req">*</span></label>
        <input type="text" id="identity_number" inputmode="numeric" required>
      </div>
      <div class="field">
        <label><span data-i18n="labelFullName"></span> <span class="req">*</span></label>
        <input type="text" id="full_name" required readonly data-i18n-placeholder="placeholderFullName">
        <p class="hint" id="name-lookup-hint"></p>
      </div>
      <div class="field">
        <label><span data-i18n="labelVehiclePlate"></span> <span class="req">*</span></label>
        <input type="text" id="vehicle_plate" list="vehicle_plate_list" required autocomplete="off" data-i18n-placeholder="placeholderVehiclePlate">
        <datalist id="vehicle_plate_list"></datalist>
      </div>
      <div class="field">
        <label><span data-i18n="labelStation"></span> <span class="req">*</span></label>
        <select id="station_name" required>
          <option value="" disabled selected data-i18n="optionStation"></option>
        </select>
      </div>

      <div class="field">
        <label id="odo-label"></label>
        <input type="number" id="odo_reading" required inputmode="decimal">
      </div>
      <div class="field">
        <label id="photo-label"></label>
        <input type="file" id="odo_photo" accept="image/*" capture="environment" required>
      </div>

      <div id="start-fields">
        <div class="field">
          <label><span data-i18n="labelConditionVideo"></span> <span class="req">*</span></label>
          <input type="file" id="condition_video" accept="video/*" capture="environment" required>
        </div>
        <div class="field">
          <label><span data-i18n="labelOfd"></span> <span class="req">*</span></label>
          <input type="number" id="ofd_count" inputmode="numeric" required>
        </div>
      </div>

      <div id="end-fields" style="display:none">
        <div class="section-title" data-i18n="sectionDelivery"></div>
        <div class="field">
          <label><span data-i18n="labelCod"></span> <span class="req">*</span></label>
          <input type="number" id="cod_delivered" inputmode="numeric">
        </div>
        <div class="field">
          <label><span data-i18n="labelPpd"></span> <span class="req">*</span></label>
          <input type="number" id="ppd_delivered" inputmode="numeric">
        </div>
        <div class="field">
          <label><span data-i18n="labelPickedUp"></span> <span class="req">*</span></label>
          <input type="number" id="picked_up" inputmode="numeric">
        </div>
        <div class="field">
          <label><span data-i18n="labelClientScreenshot"></span> <span class="req">*</span></label>
          <input type="file" id="client_screenshot" accept="image/*">
        </div>
      </div>

      <div class="field" id="area-field" style="display:none">
        <label><span data-i18n="labelArea"></span> <span class="req">*</span></label>
        <input type="text" id="area">
      </div>
      <div class="field" id="amount-field" style="display:none">
        <label><span data-i18n="labelAmount"></span> <span class="req">*</span></label>
        <input type="number" id="amount" inputmode="decimal">
      </div>

      <button type="submit" class="submit" id="submit-btn" data-i18n="submit"></button>
      <div id="status"></div>
    </form>
  </div>

  <div id="screen-success" style="display:none">
    <div class="success-icon">✓</div>
    <h2 data-i18n="successTitle"></h2>
    <p class="success-message" data-i18n="successMessage"></p>
    <button type="button" class="submit" id="new-entry-btn" data-i18n="newEntryBtn"></button>
  </div>
</div>

let currentLang = localStorage.getItem("gbe_form_lang") || "ar";
if (!translations[currentLang]) currentLang = "ar";

function t(key) {
  return (translations[currentLang] && translations[currentLang][key]) || translations.ar[key] || key;
}

function updateDynamicLabels() {
  const odoLabel = document.getElementById("odo-label");
  const photoLabel = document.getElementById("photo-label");
  let odoText, photoText;
  if (shiftType === "start") { odoText = t("labelOdoStart"); photoText = t("labelPhotoStart"); }
  else if (shiftType === "end") { odoText = t("labelOdoEnd"); photoText = t("labelPhotoEnd"); }
  else { odoText = t("labelOdoGeneric"); photoText = t("labelPhotoGeneric"); }
  odoLabel.innerHTML = odoText + ' <span class="req">*</span>';
  photoLabel.innerHTML = photoText + ' <span class="req">*</span>';
}

function applyTranslations() {
  document.title = t("pageTitle");
  document.documentElement.lang = currentLang;
  document.documentElement.dir = translations[currentLang].dir;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll("#lang-switch button").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === currentLang);
  });
  updateDynamicLabels();
}

document.querySelectorAll("#lang-switch button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentLang = btn.dataset.lang;
    localStorage.setItem("gbe_form_lang", currentLang);
    applyTranslations();
  });
});

function headers(extra) {
  return Object.assign({ apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }, extra || {});
}

async function loadStations() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/stations?select=station_name&order=station_name`, { headers: headers() });
    const rows = await res.json();
    const sel = document.getElementById("station_name");
    for (const r of rows) {
      if (!r.station_name) continue;
      const opt = document.createElement("option");
      opt.value = r.station_name;
      opt.textContent = r.station_name;
      sel.appendChild(opt);
    }
  } catch (e) { /* dropdown just stays optional-only if this fails */ }
}

let validPlates = new Set();
async function loadVehicles() {
  const list = document.getElementById("vehicle_plate_list");
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/vehicles?select=vehicle_plate&is_active=eq.true&order=vehicle_plate`, { headers: headers() });
    const rows = await res.json();
    for (const r of rows) {
      if (!r.vehicle_plate) continue;
      validPlates.add(r.vehicle_plate);
      const opt = document.createElement("option");
      opt.value = r.vehicle_plate;
      list.appendChild(opt);
    }
  } catch (e) { /* no vehicles loaded */ }
}

let identityLookupTimer = null;
async function lookupDriverName(identityNumber) {
  const nameField = document.getElementById("full_name");
  const hint = document.getElementById("name-lookup-hint");
  hint.textContent = t("lookupSearching");
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/drivers?select=full_name&identity_number=eq.${encodeURIComponent(identityNumber)}&limit=1`, { headers: headers() });
    const rows = await res.json();
    if (rows[0]?.full_name) {
      nameField.value = rows[0].full_name;
      hint.textContent = "";
    } else {
      nameField.value = "";
      hint.textContent = t("lookupNotFound");
    }
  } catch (e) {
    nameField.value = "";
    hint.textContent = t("lookupError");
  }
}

document.getElementById("identity_number").addEventListener("input", (e) => {
  clearTimeout(identityLookupTimer);
  document.getElementById("full_name").value = "";
  const hint = document.getElementById("name-lookup-hint");
  const val = e.target.value.trim();
  if (val.length < 5) { hint.textContent = ""; return; }
  identityLookupTimer = setTimeout(() => lookupDriverName(val), 400);
});

function setStatus(kind, text) {
  const el = document.getElementById("status");
  el.className = kind;
  el.textContent = text;
}

async function uploadFile(file, prefix) {
  if (!file) return null;
  const safeName = file.name.replace(/[^\w.\-]+/g, "_");
  const path = `${prefix}_${Date.now()}_${safeName}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${path}`, {
    method: "POST",
    headers: headers({ "Content-Type": file.type || "application/octet-stream" }),
    body: file,
  });
  if (!res.ok) throw new Error(`رفع الملف فشل: ${await res.text()}`);
  return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${path}`;
}

const START_ONLY_FIELDS = ["condition_video", "ofd_count"];
const END_ONLY_FIELDS = ["cod_delivered", "ppd_delivered", "picked_up", "client_screenshot"];

document.querySelectorAll(".toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".toggle button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    shiftType = btn.dataset.type;
    const isStart = shiftType === "start";
    const isEnd = shiftType === "end";
    const isReinforcement = shiftType === "reinforcement";

    document.getElementById("shift-form").style.display = "block";
    document.getElementById("start-fields").style.display = isStart ? "block" : "none";
    document.getElementById("end-fields").style.display = isEnd ? "block" : "none";
    document.getElementById("area-field").style.display = isStart ? "block" : "none";
    document.getElementById("amount-field").style.display = isReinforcement ? "block" : "none";
    document.getElementById("area").required = isStart;
    document.getElementById("amount").required = isReinforcement;

    updateDynamicLabels();
    START_ONLY_FIELDS.forEach(id => { document.getElementById(id).required = isStart; });
    END_ONLY_FIELDS.forEach(id => { document.getElementById(id).required = isEnd; });
  });
});

function showScreen(name) {
  document.getElementById("screen-form").style.display = name === "form" ? "block" : "none";
  document.getElementById("screen-success").style.display = name === "success" ? "block" : "none";
}

function resetToStart() {
  document.getElementById("shift-form").reset();
  document.getElementById("shift-form").style.display = "none";
  document.querySelectorAll(".toggle button").forEach(b => b.classList.remove("active"));
  shiftType = null;
  document.getElementById("name-lookup-hint").textContent = "";
  setStatus("", "");
  document.getElementById("status").className = "";
  setDefaultShiftDate();
  showScreen("form");
}

document.getElementById("new-entry-btn").addEventListener("click", resetToStart);

document.getElementById("shift-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!isConfigured) { document.getElementById("config-note").style.display = "block"; return; }

  const plateInput = document.getElementById("vehicle_plate");
  if (!validPlates.has(plateInput.value.trim())) {
    setStatus("err", t("errNoPlate"));
    plateInput.focus();
    return;
  }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  setStatus("busy", t("submitBusy"));

  try {
    const odoPhotoFile = document.getElementById("odo_photo").files[0];

    if (shiftType === "reinforcement") {
      const odoPhotoUrl = await uploadFile(odoPhotoFile, "reinforcement-odo");
      const payload = {
        p_identity_number: document.getElementById("identity_number").value.trim(),
        p_full_name: document.getElementById("full_name").value.trim(),
        p_vehicle_plate: document.getElementById("vehicle_plate").value.trim(),
        p_station_name: document.getElementById("station_name").value || null,
        p_odo_reading: Number(document.getElementById("odo_reading").value),
        p_odo_photo_url: odoPhotoUrl,
        p_amount: Number(document.getElementById("amount").value),
        p_shift_date: document.getElementById("shift_date").value,
      };
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_reinforcement_request`, {
        method: "POST",
        headers: headers({ "Content-Type": "application/json" }),
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(await res.text());
    } else {
      const videoFile = document.getElementById("condition_video")?.files[0];
      const screenshotFile = document.getElementById("client_screenshot")?.files[0];

      const [odoPhotoUrl, videoUrl, screenshotUrl] = await Promise.all([
        uploadFile(odoPhotoFile, "odo"),
        uploadFile(videoFile, "condition-video"),
        uploadFile(screenshotFile, "client-screenshot"),
      ]);

      const payload = {
        p_identity_number: document.getElementById("identity_number").value.trim(),
        p_full_name: document.getElementById("full_name").value.trim(),
        p_vehicle_plate: document.getElementById("vehicle_plate").value.trim(),
        p_station_name: document.getElementById("station_name").value || null,
        p_shift_type: shiftType,
        p_odo_reading: Number(document.getElementById("odo_reading").value),
        p_odo_photo_url: odoPhotoUrl,
        p_condition_video_url: videoUrl,
        p_ofd_count: document.getElementById("ofd_count")?.value ? Number(document.getElementById("ofd_count").value) : null,
        p_cod_delivered: document.getElementById("cod_delivered")?.value ? Number(document.getElementById("cod_delivered").value) : null,
        p_ppd_delivered: document.getElementById("ppd_delivered")?.value ? Number(document.getElementById("ppd_delivered").value) : null,
        p_picked_up: document.getElementById("picked_up")?.value ? Number(document.getElementById("picked_up").value) : null,
        p_client_screenshot_url: screenshotUrl,
        p_area: document.getElementById("area").value || null,
        p_shift_date: document.getElementById("shift_date").value,
      };

      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_shift_entry`, {
        method: "POST",
        headers: headers({ "Content-Type": "application/json" }),
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(await res.text());
    }

    showScreen("success");
  } catch (err) {
    console.error(err);
    setStatus("err", t("errGeneric") + err.message);
  } finally {
    btn.disabled = false;
  }
});

function setDefaultShiftDate() {
  const d = new Date();
  const localDate = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  document.getElementById("shift_date").value = localDate;
}

applyTranslations();
setDefaultShiftDate();
loadStations();
loadVehicles();
</script>
</body>
