<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل دوام — GBE Fleet Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    color: #f5f7ff;
    background: #10182f;
    font-synthesis: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-width: 320px; background: #10182f; }
  button, input, select { font: inherit; }

  .page-shell {
    min-height: 100vh; position: relative; overflow: hidden; padding: 22px 14px 36px;
    background:
      radial-gradient(circle at 75% 5%, rgba(50,78,190,.34), transparent 38%),
      radial-gradient(circle at 20% 45%, rgba(76,34,150,.22), transparent 42%),
      linear-gradient(145deg, #10172f 0%, #182545 52%, #131a30 100%);
  }

  .ambient { position: fixed; width: 380px; height: 380px; border-radius: 50%; filter: blur(110px); pointer-events: none; opacity: .18; }
  .ambient-one { background: #304cff; top: -220px; inset-inline-end: 5%; }
  .ambient-two { background: #722cff; bottom: -240px; inset-inline-start: -120px; }

  .lang-switch { display: flex; gap: 0.4rem; justify-content: flex-end; flex-wrap: wrap; max-width: min(100%, 1060px); margin: 0 auto 10px; position: relative; z-index: 1; }
  .lang-switch button {
    padding: 0.35rem 0.75rem; border-radius: 999px; border: 1px solid rgba(105,124,161,.32); background: rgba(13,25,48,.82);
    color: #8795b1; font-size: 0.78rem; font-weight: 600; cursor: pointer;
  }
  .lang-switch button.active { border-color: #5975ff; color: #edf1fa; background: rgba(76,102,255,.18); }

  .container {
    width: min(100%, 1060px); margin: auto; position: relative; z-index: 1;
    border: 1px solid rgba(104,129,190,.22); border-radius: 22px; padding: 15px;
    background: rgba(5,11,25,.66); box-shadow: 0 25px 80px rgba(0,0,0,.38); backdrop-filter: blur(18px);
  }

  .hero {
    min-height: 190px; position: relative; display: flex; align-items: center; padding: 30px 34px;
    overflow: hidden; border-radius: 18px;
    background-image: url('hero.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border: 1px solid rgba(92,118,177,.18);
  }

  .brand { flex: 0 0 auto; }
  .logo {
    width: 116px; height: 116px; border-radius: 17px; display: flex; flex-direction: column; justify-content: center;
    align-items: center; position: relative; background: linear-gradient(145deg, #344aff, #2638d6);
    box-shadow: 0 15px 40px rgba(44,63,255,.26);
  }
  .logo span { font-size: 29px; font-weight: 800; letter-spacing: -1px; }
  .logo small { font-size: 8px; margin-top: -2px; opacity: .9; }
  .logo i { width: 31px; height: 4px; border-radius: 8px; background: #e9f12d; transform: skewX(-28deg); margin-top: 3px; }
  :root[dir="rtl"] .logo i { transform: skewX(28deg); }

  .hero-copy { margin-inline-start: 28px; position: relative; z-index: 2; }
  .eyebrow { color: #cdd8ff; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .hero h1 { margin: 0; font-size: clamp(27px, 4vw, 41px); line-height: 1.08; letter-spacing: -1.5px; text-shadow: 0 2px 14px rgba(0,0,0,.7); }
  .hero p { color: #dfe4f5; margin: 13px 0 0; font-size: 16px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .hero p span { color: #9fb0ff; }

  .truck-art { position: absolute; inset-inline-end: 10px; bottom: -12px; width: 390px; height: 170px; opacity: .88; }
  .truck-icon { position: absolute; inset-inline-end: 66px; bottom: 23px; width: 130px; height: 78px; color: #7d9eff; filter: drop-shadow(0 8px 20px rgba(70,104,255,.30)); }
  .pin-icon { position: absolute; inset-inline-end: 18px; top: 15px; width: 38px; height: 38px; color: #929eff; filter: drop-shadow(0 0 12px rgba(128,121,255,.55)); }
  .route-line { position: absolute; width: 290px; height: 85px; inset-inline-end: 0; bottom: 18px; border-bottom: 2px dashed rgba(173,190,255,.68); border-radius: 0 0 70% 40%; transform: rotate(-7deg); }
  :root[dir="rtl"] .route-line { transform: rotate(7deg) scaleX(-1); }
  .city { position: absolute; bottom: 22px; background: linear-gradient(to top, rgba(46,70,130,.38), transparent); }
  .city-a { inset-inline-end: 280px; width: 35px; height: 72px; }
  .city-b { inset-inline-end: 245px; width: 50px; height: 100px; }
  .city-c { inset-inline-end: 205px; width: 30px; height: 58px; }

  .panel {
    margin-top: 15px; padding: 27px 31px 31px; border-radius: 18px; border: 1px solid rgba(89,116,177,.20);
    background: linear-gradient(145deg, rgba(10,20,42,.82), rgba(8,16,34,.72));
  }

  .section-title { display: flex; align-items: center; gap: 14px; margin-bottom: 23px; }
  .step {
    width: 43px; height: 43px; display: grid; place-items: center; border-radius: 13px; color: #91a1ff;
    font-size: 19px; font-weight: 700; background: linear-gradient(145deg, #1c2c72, #15235b);
    border: 1px solid rgba(96,119,255,.35); flex: 0 0 auto;
  }
  .section-title h2 { margin: 0; font-size: 22px; }
  .section-title p { margin: 4px 0 0; color: #71809f; font-size: 12px; }

  .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .action-card {
    min-height: 190px; cursor: pointer; color: #f5f7ff; position: relative; border-radius: 15px;
    border: 1px solid rgba(104,123,162,.25); background: rgba(18,29,52,.55); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; transition: .22s ease; text-align: center; padding: 0 12px;
  }
  .action-card:hover { transform: translateY(-3px); border-color: #4f6eff; background: rgba(27,42,78,.68); }
  .action-card.active { border-color: #5c7aff; box-shadow: 0 0 0 1px rgba(77,104,255,.4), 0 18px 35px rgba(30,61,255,.15); }
  .action-card.green.active { border-color: #28b47b; box-shadow: 0 0 0 1px rgba(40,180,123,.35); }

  .action-icon { width: 65px; height: 65px; display: grid; place-items: center; border-radius: 50%; color: white; background: linear-gradient(145deg, #345cff, #263bd4); }
  .action-icon svg { width: 28px; height: 28px; }
  .action-card:nth-child(2) .action-icon { background: linear-gradient(145deg, #7445ed, #4b2ac6); }
  .action-card.green .action-icon { color: #b8ffd8; background: rgba(26,166,101,.28); }
  .action-card strong { font-size: 17px; }
  .action-card small { color: #8592ac; font-size: 13px; }

  .selected { position: absolute; top: 13px; inset-inline-end: 13px; width: 29px; height: 29px; display: none; place-items: center; border-radius: 50%; background: #526fff; color: #fff; }
  .selected svg { width: 17px; height: 17px; }
  .action-card.active .selected { display: grid; }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 25px; }
  .field.full { grid-column: 1 / -1; }

  .field label { display: block; color: #cbd4e6; font-size: 13px; font-weight: 600; margin: 0 0 9px; }
  .field label b { color: #ff5d67; }

  .input-wrap {
    min-height: 53px; display: flex; align-items: center; gap: 12px; padding: 0 15px;
    border: 1px solid rgba(105,124,161,.32); border-radius: 11px; background: rgba(13,25,48,.82);
    color: #8795b1; transition: .2s;
  }
  .input-wrap:focus-within { border-color: #5975ff; box-shadow: 0 0 0 3px rgba(76,102,255,.11); }
  .input-wrap svg { flex: 0 0 auto; width: 19px; height: 19px; }
  .input-wrap input, .input-wrap select { width: 100%; border: 0; outline: 0; background: transparent; color: #edf1fa; font-size: 14px; }
  .input-wrap input::placeholder { color: #65738e; }
  .input-wrap input[type="date"] { color-scheme: dark; }
  .input-wrap input[type="file"] { font-size: 12.5px; color: #8795b1; }
  .input-wrap select { appearance: none; cursor: pointer; }
  .input-wrap select option { background: #0b1426; }
  .select-wrap > svg:last-child { margin-inline-start: auto; }
  .disabled { background: rgba(15,24,43,.5); }
  .success-icon { color: #36d995; flex: 0 0 auto; }

  .hint { margin-top: 9px; color: #73819c; font-size: 11px; line-height: 1.5; }
  .hint span { color: #8da1c6; margin-inline-end: 4px; }

  .benefits {
    margin-top: 15px; padding: 22px 27px; display: grid; grid-template-columns: repeat(4, 1fr);
    border-radius: 18px; border: 1px solid rgba(112,78,255,.42);
    background: linear-gradient(100deg, rgba(49,25,111,.48), rgba(13,30,73,.62));
  }
  .benefit { display: flex; gap: 13px; align-items: center; padding: 0 20px; border-inline-end: 1px solid rgba(145,159,205,.17); }
  .benefit:first-child { padding-inline-start: 0; }
  .benefit:last-child { border: 0; }
  .benefit-icon { color: #9b88ff; flex: 0 0 auto; }
  .benefit-icon svg { width: 34px; height: 34px; stroke-width: 1.7; }
  .benefit strong { font-size: 12px; display: block; }
  .benefit p { color: #7f8ca7; font-size: 10px; line-height: 1.5; margin: 5px 0 0; }

  .actions-footer {
    margin-top: 15px; padding: 22px 26px; display: flex; justify-content: center; gap: 26px;
    border: 1px solid rgba(91,112,158,.20); border-radius: 18px; background: rgba(9,19,39,.72);
  }
  .btn {
    width: min(100%, 280px); min-height: 54px; border-radius: 11px; cursor: pointer; display: flex;
    justify-content: center; align-items: center; gap: 10px; font-weight: 600; transition: .2s; border: 0;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:disabled { opacity: .55; cursor: default; transform: none; }
  .btn svg { width: 19px; height: 19px; }
  .btn-secondary { color: #dce2ee; background: transparent; border: 1px solid #3a527c; }
  .btn-primary { color: white; background: linear-gradient(100deg, #2856ef, #6534ed); box-shadow: 0 12px 28px rgba(62,61,235,.25); }

  #status { margin-top: 15px; padding: 0.9rem 1.1rem; border-radius: 12px; font-size: 0.88rem; display: none; text-align: center; }
  #status.ok { display: block; background: rgba(34,197,94,.14); color: #4ade80; }
  #status.err { display: block; background: rgba(239,68,68,.14); color: #f87171; }
  #status.busy { display: block; background: rgba(13,25,48,.82); color: #8795b1; border: 1px solid rgba(105,124,161,.32); }

  #config-note {
    display: none; background: rgba(13,25,48,.82); border: 1px solid rgba(105,124,161,.32); border-radius: 12px;
    padding: 1rem 1.1rem; margin-top: 15px; font-size: 0.85rem; color: #8795b1;
  }
  #config-note code { background: rgba(255,255,255,0.08); padding: 0.1rem 0.35rem; border-radius: 4px; }

  #screen-success .success-badge {
    width: 74px; height: 74px; border-radius: 50%; background: linear-gradient(145deg, #22c55e, #16a34a);
    color: #fff; display: flex; align-items: center; justify-content: center; margin: 6px auto 18px;
    box-shadow: 0 15px 40px rgba(34,197,94,.3);
  }
  #screen-success .success-badge svg { width: 34px; height: 34px; }
  #screen-success h2 { text-align: center; margin: 0 0 10px; font-size: 22px; }
  #screen-success .success-message { text-align: center; color: #9ba9c5; font-size: 14px; line-height: 1.6; margin: 0 0 22px; max-width: 480px; margin-inline: auto; }
  #screen-success .actions-footer { justify-content: center; }
  .success-summary { max-width: 420px; margin: 0 auto 26px; border: 1px solid rgba(105,124,161,.32); border-radius: 12px; background: rgba(13,25,48,.7); padding: 4px 20px; }
  .success-summary-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid rgba(105,124,161,.18); font-size: 13px; }
  .success-summary-row:last-child { border-bottom: 0; }
  .success-summary-row span { color: #8795b1; }
  .success-summary-row strong { color: #edf1fa; font-size: 14px; }

  footer.page-footer { text-align: center; color: #53617b; font-size: 10px; padding: 18px 0 3px; }

  @media (max-width: 820px) {
    .hero { padding: 25px; }
    .truck-art { opacity: .32; inset-inline-end: -80px; }
    .action-grid { grid-template-columns: 1fr; }
    .action-card { min-height: 145px; }
    .benefits { grid-template-columns: 1fr 1fr; gap: 22px; }
    .benefit:nth-child(2) { border-inline-end: 0; }
    .benefit:nth-child(3), .benefit:nth-child(4) { padding-top: 15px; }
  }

  @media (max-width: 620px) {
    .page-shell { padding: 8px; }
    .container { padding: 8px; border-radius: 16px; }
    .hero { min-height: 250px; align-items: flex-start; }
    .logo { width: 82px; height: 82px; }
    .logo span { font-size: 23px; }
    .hero-copy { margin-inline-start: 15px; }
    .hero h1 { font-size: 24px; }
    .hero p { font-size: 13px; }
    .eyebrow { font-size: 9px; }
    .panel { padding: 21px 17px; }
    .fields { grid-template-columns: 1fr; gap: 18px; }
    .field.full { grid-column: auto; }
    .benefits { grid-template-columns: 1fr; padding: 20px; }
    .benefit, .benefit:first-child { padding: 0; border-inline-end: 0; }
    .benefit:nth-child(3), .benefit:nth-child(4) { padding-top: 0; }
    .actions-footer { flex-direction: column; gap: 12px; padding: 17px; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true">
  <symbol id="icon-play" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="icon-square" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect width="18" height="18" x="3" y="3" rx="2"/></symbol>
  <symbol id="icon-walletcards" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12V8a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h6"/><path d="M3 10h18"/><rect x="12" y="13" width="9" height="6" rx="1.3"/>
  </symbol>
  <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/>
  </symbol>
  <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
  </symbol>
  <symbol id="icon-car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 16.5V11l2.2-5h11.6l2.2 5v5.5"/><path d="M4 16.5h16"/><circle cx="7.5" cy="16.5" r="1.6"/><circle cx="16.5" cy="16.5" r="1.6"/>
  </symbol>
  <symbol id="icon-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s7-6.7 7-12.3A7 7 0 0 0 5 9.7C5 15.3 12 22 12 22Z"/><circle cx="12" cy="9.6" r="2.4"/>
  </symbol>
  <symbol id="icon-gauge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.34 19a10 10 0 1 1 17.32 0"/><path d="m12 14 4-4"/>
  </symbol>
  <symbol id="icon-chevrondown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6Z"/><path d="M9 12l2 2 4-4"/>
  </symbol>
  <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>
  </symbol>
  <symbol id="icon-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/>
  </symbol>
  <symbol id="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10Z"/><path d="M10 19a2 2 0 0 0 4 0"/>
  </symbol>
  <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="icon-truck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/>
    <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/>
    <circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>
  </symbol>
  <symbol id="icon-checkcircle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.8 10A10 10 0 1 1 17 3.34"/><path d="m9 11 3 3L22 4"/>
  </symbol>
  <symbol id="icon-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8h3l2-2h6l2 2h3v11H4Z"/><circle cx="12" cy="13.5" r="3.3"/>
  </symbol>
  <symbol id="icon-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3Z"/>
  </symbol>
  <symbol id="icon-package" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>
  </symbol>
  <symbol id="icon-banknote" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6.5 9h.01M17.5 15h.01"/>
  </symbol>
</svg>

<main class="page-shell">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <div class="lang-switch" id="lang-switch">
    <button type="button" data-lang="ar">عربي</button>
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="ur">اردو</button>
    <button type="button" data-lang="bn">বাংলা</button>
  </div>

  <div class="container">
    <header class="hero">
      <div class="brand">
        <div class="logo"><span>GBE</span><small>Logistics</small><i></i></div>
      </div>
      <div class="hero-copy">
        <div class="eyebrow" data-i18n="eyebrow"></div>
        <h1 data-i18n="heading"></h1>
        <p><span data-i18n="taglinePlain"></span> <span data-i18n="taglineAccent"></span></p>
      </div>
      <div class="truck-art" aria-hidden="true">
        <div class="route-line"></div>
        <svg class="truck-icon"><use href="#icon-truck"/></svg>
        <svg class="pin-icon"><use href="#icon-pin"/></svg>
        <div class="city city-a"></div>
        <div class="city city-b"></div>
        <div class="city city-c"></div>
      </div>
    </header>

    <div id="config-note" data-i18n="configNote"></div>

    <div id="screen-form">
      <section class="panel">
        <div class="section-title">
          <div class="step">1</div>
          <div>
            <h2 data-i18n="chooseTypeTitle"></h2>
            <p data-i18n="chooseTypeSubtitle"></p>
          </div>
        </div>

        <div class="action-grid" id="type-toggle">
          <button type="button" class="action-card" data-type="start">
            <span class="selected"><svg><use href="#icon-checkcircle"/></svg></span>
            <span class="action-icon"><svg><use href="#icon-play"/></svg></span>
            <strong data-i18n="typeStart"></strong>
            <small data-i18n="typeStartDesc"></small>
          </button>
          <button type="button" class="action-card" data-type="end">
            <span class="selected"><svg><use href="#icon-checkcircle"/></svg></span>
            <span class="action-icon"><svg><use href="#icon-square"/></svg></span>
            <strong data-i18n="typeEnd"></strong>
            <small data-i18n="typeEndDesc"></small>
          </button>
          <button type="button" class="action-card green" data-type="reinforcement">
            <span class="selected"><svg><use href="#icon-checkcircle"/></svg></span>
            <span class="action-icon"><svg><use href="#icon-walletcards"/></svg></span>
            <strong data-i18n="typeReinforcement"></strong>
            <small data-i18n="typeReinforcementDesc"></small>

let currentLang = localStorage.getItem("gbe_form_lang") || "ar";
if (!translations[currentLang]) currentLang = "ar";

function t(key) {
  return (translations[currentLang] && translations[currentLang][key]) || translations.ar[key] || key;
}

function updateDynamicLabels() {
  const odoLabel = document.getElementById("odo-label");
  const photoLabel = document.getElementById("photo-label");
  const odoInput = document.getElementById("odo_reading");
  let odoText, photoText, odoPh;
  if (shiftType === "start") { odoText = t("labelOdoStart"); photoText = t("labelPhotoStart"); odoPh = t("phOdoStart"); }
  else if (shiftType === "end") { odoText = t("labelOdoEnd"); photoText = t("labelPhotoEnd"); odoPh = t("phOdoEnd"); }
  else { odoText = t("labelOdoGeneric"); photoText = t("labelPhotoGeneric"); odoPh = t("phOdo"); }
  odoLabel.innerHTML = odoText + ' <b>*</b>';
  photoLabel.innerHTML = photoText + ' <b>*</b>';
  odoInput.placeholder = odoPh;
}

function applyTranslations() {
  document.title = t("pageTitle");
  document.documentElement.lang = currentLang;
  document.documentElement.dir = translations[currentLang].dir;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll("#lang-switch button").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === currentLang);
  });
  updateDynamicLabels();
}

document.querySelectorAll("#lang-switch button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentLang = btn.dataset.lang;
    localStorage.setItem("gbe_form_lang", currentLang);
    applyTranslations();
  });
});

function headers(extra) {
  return Object.assign({ apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }, extra || {});
}

async function loadStations() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/stations?select=station_name&order=station_name`, { headers: headers() });
    const rows = await res.json();
    const sel = document.getElementById("station_name");
    for (const r of rows) {
      if (!r.station_name) continue;
      const opt = document.createElement("option");
      opt.value = r.station_name;
      opt.textContent = r.station_name;
      sel.appendChild(opt);
    }
  } catch (e) { /* dropdown just stays optional-only if this fails */ }
}

let validPlates = new Set();
async function loadVehicles() {
  const list = document.getElementById("vehicle_plate_list");
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/vehicles?select=vehicle_plate&is_active=eq.true&order=vehicle_plate`, { headers: headers() });
    const rows = await res.json();
    for (const r of rows) {
      if (!r.vehicle_plate) continue;
      validPlates.add(r.vehicle_plate);
      const opt = document.createElement("option");
      opt.value = r.vehicle_plate;
      list.appendChild(opt);
    }
  } catch (e) { /* no vehicles loaded */ }
}

let identityLookupTimer = null;
async function lookupDriverName(identityNumber) {
  const nameField = document.getElementById("full_name");
  const hint = document.getElementById("name-lookup-hint");
  const successIcon = document.getElementById("name-success-icon");
  hint.textContent = t("lookupSearching");
  successIcon.style.display = "none";
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/drivers?select=full_name&identity_number=eq.${encodeURIComponent(identityNumber)}&limit=1`, { headers: headers() });
    const rows = await res.json();
    if (rows[0]?.full_name) {
      nameField.value = rows[0].full_name;
      hint.textContent = "";
      successIcon.style.display = "block";
    } else {
      nameField.value = "";
      hint.textContent = t("lookupNotFound");
    }
  } catch (e) {
    nameField.value = "";
    hint.textContent = t("lookupError");
  }
}

document.getElementById("identity_number").addEventListener("input", (e) => {
  clearTimeout(identityLookupTimer);
  document.getElementById("full_name").value = "";
  document.getElementById("name-success-icon").style.display = "none";
  const hint = document.getElementById("name-lookup-hint");
  const val = e.target.value.trim();
  if (val.length < 5) { hint.textContent = ""; return; }
  identityLookupTimer = setTimeout(() => lookupDriverName(val), 400);
});

function setStatus(kind, text) {
  const el = document.getElementById("status");
  el.className = kind;
  el.textContent = text;
}

async function uploadFile(file, prefix) {
  if (!file) return null;
  const safeName = file.name.replace(/[^\w.\-]+/g, "_");
  const fileName = `${prefix}_${Date.now()}_${safeName}`;
  const res = await fetch(UPLOAD_FUNCTION_URL, {
    method: "POST",
    headers: headers({
      "Content-Type": file.type || "application/octet-stream",
      "x-file-name": fileName,
    }),
    body: file,
  });
  if (!res.ok) throw new Error(`رفع الملف فشل: ${await res.text()}`);
  const json = await res.json();
  return json.url;
}

const START_ONLY_FIELDS = ["condition_video", "ofd_count"];
const END_ONLY_FIELDS = ["cod_delivered", "ppd_delivered", "picked_up", "client_screenshot"];

document.querySelectorAll(".action-card").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".action-card").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    shiftType = btn.dataset.type;
    const isStart = shiftType === "start";
    const isEnd = shiftType === "end";
    const isReinforcement = shiftType === "reinforcement";

    document.getElementById("shift-info-card").style.display = "block";
    document.getElementById("benefits-panel").style.display = "grid";
    document.getElementById("actions-footer").style.display = "flex";
    document.getElementById("start-fields").style.display = isStart ? "contents" : "none";
    document.getElementById("end-fields").style.display = isEnd ? "contents" : "none";
    document.getElementById("area-field").style.display = isStart ? "block" : "none";
    document.getElementById("amount-field").style.display = isReinforcement ? "block" : "none";
    document.getElementById("area").required = isStart;
    document.getElementById("amount").required = isReinforcement;

    updateDynamicLabels();
    START_ONLY_FIELDS.forEach(id => { document.getElementById(id).required = isStart; });
    END_ONLY_FIELDS.forEach(id => { document.getElementById(id).required = isEnd; });
  });
});

function showScreen(name) {
  document.getElementById("screen-form").style.display = name === "form" ? "block" : "none";
  document.getElementById("screen-success").style.display = name === "success" ? "block" : "none";
}

function resetToStart() {
  document.getElementById("shift-form").reset();
  document.getElementById("shift-info-card").style.display = "none";
  document.getElementById("benefits-panel").style.display = "none";
  document.getElementById("actions-footer").style.display = "none";
  document.querySelectorAll(".action-card").forEach(b => b.classList.remove("active"));
  shiftType = null;
  document.getElementById("name-lookup-hint").textContent = "";
  document.getElementById("name-success-icon").style.display = "none";
  setStatus("", "");
  document.getElementById("status").className = "";
  setDefaultShiftDate();
  showScreen("form");
}

document.getElementById("new-entry-btn").addEventListener("click", resetToStart);

document.getElementById("clear-form-btn").addEventListener("click", () => {
  document.getElementById("shift-form").reset();
  document.getElementById("name-lookup-hint").textContent = "";
  document.getElementById("name-success-icon").style.display = "none";
  setStatus("", "");
  document.getElementById("status").className = "";
  setDefaultShiftDate();
});

document.getElementById("shift-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!isConfigured) { document.getElementById("config-note").style.display = "block"; return; }

  const plateInput = document.getElementById("vehicle_plate");
  if (!validPlates.has(plateInput.value.trim())) {
    setStatus("err", t("errNoPlate"));
    plateInput.focus();
    return;
  }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  setStatus("busy", t("submitBusy"));

  try {
    const odoPhotoFile = document.getElementById("odo_photo").files[0];

    if (shiftType === "reinforcement") {
      const odoPhotoUrl = await uploadFile(odoPhotoFile, "reinforcement-odo");
      const payload = {
        p_identity_number: document.getElementById("identity_number").value.trim(),
        p_full_name: document.getElementById("full_name").value.trim(),
        p_vehicle_plate: document.getElementById("vehicle_plate").value.trim(),
        p_station_name: document.getElementById("station_name").value || null,
        p_odo_reading: Number(document.getElementById("odo_reading").value),
        p_odo_photo_url: odoPhotoUrl,
        p_amount: Number(document.getElementById("amount").value),
        p_shift_date: document.getElementById("shift_date").value,
      };
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_reinforcement_request`, {
        method: "POST",
        headers: headers({ "Content-Type": "application/json" }),
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(await res.text());
    } else {
      const videoFile = document.getElementById("condition_video")?.files[0];
      const screenshotFile = document.getElementById("client_screenshot")?.files[0];

      const [odoPhotoUrl, videoUrl, screenshotUrl] = await Promise.all([
        uploadFile(odoPhotoFile, "odo"),
        uploadFile(videoFile, "condition-video"),
        uploadFile(screenshotFile, "client-screenshot"),
      ]);

      const payload = {
        p_identity_number: document.getElementById("identity_number").value.trim(),
        p_full_name: document.getElementById("full_name").value.trim(),
        p_vehicle_plate: document.getElementById("vehicle_plate").value.trim(),
        p_station_name: document.getElementById("station_name").value || null,
        p_shift_type: shiftType,
        p_odo_reading: Number(document.getElementById("odo_reading").value),
        p_odo_photo_url: odoPhotoUrl,
        p_condition_video_url: videoUrl,
        p_ofd_count: document.getElementById("ofd_count")?.value ? Number(document.getElementById("ofd_count").value) : null,
        p_cod_delivered: document.getElementById("cod_delivered")?.value ? Number(document.getElementById("cod_delivered").value) : null,
        p_ppd_delivered: document.getElementById("ppd_delivered")?.value ? Number(document.getElementById("ppd_delivered").value) : null,
        p_picked_up: document.getElementById("picked_up")?.value ? Number(document.getElementById("picked_up").value) : null,
        p_client_screenshot_url: screenshotUrl,
        p_area: document.getElementById("area").value || null,
        p_shift_date: document.getElementById("shift_date").value,
      };

      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_shift_entry`, {
        method: "POST",
        headers: headers({ "Content-Type": "application/json" }),
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(await res.text());
    }

    const typeKey = shiftType === "start" ? "typeStart" : shiftType === "end" ? "typeEnd" : "typeReinforcement";
    document.getElementById("success-name").textContent = document.getElementById("full_name").value.trim();
    document.getElementById("success-id").textContent = document.getElementById("identity_number").value.trim();
    document.getElementById("success-type").textContent = t(typeKey);
    showScreen("success");
  } catch (err) {
    console.error(err);
    setStatus("err", t("errGeneric") + err.message);
  } finally {
    btn.disabled = false;
  }
});

function setDefaultShiftDate() {
  const d = new Date();
  const localDate = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  document.getElementById("shift_date").value = localDate;
}

applyTranslations();
setDefaultShiftDate();
loadStations();
loadVehicles();
